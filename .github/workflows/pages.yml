name: pages
on: {push: {branches: [main]}}
permissions: {pages: write, id-token: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run --frozen python -m pytest tests/
      - run: tools/setup-tweego.sh
      - run: mkdir -p dist dist/assets/glass dist/assets/bronze dist/assets/indigo dist/assets/alabaster && (cp src/glass/assets/*.webp dist/assets/glass/ 2>/dev/null || true) && (cp src/bronze/assets/*.webp dist/assets/bronze/ 2>/dev/null || true) && (cp src/indigo/assets/*.webp dist/assets/indigo/ 2>/dev/null || true) && (cp src/alabaster/assets/*.webp dist/assets/alabaster/ 2>/dev/null || true) && build/tweego/tweego src/glass -o dist/glass.html && node tools/patch-chapbook.js dist/glass.html && build/tweego/tweego src/bronze -o dist/bronze.html && node tools/patch-chapbook.js dist/bronze.html && build/tweego/tweego src/indigo -o dist/indigo.html && node tools/patch-chapbook.js dist/indigo.html && build/tweego/tweego src/alabaster -o dist/alabaster.html && node tools/patch-chapbook.js dist/alabaster.html && python3 tools/build-landing.py && ls -la dist dist/assets/glass dist/assets/bronze dist/assets/indigo dist/assets/alabaster
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4
