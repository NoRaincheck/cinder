name: pages
on: {push: {branches: [main]}}
permissions: {pages: write, id-token: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run --frozen python -m pytest tests/
      - run: tools/setup-tweego.sh
      - run: mkdir -p dist dist/assets/glass dist/assets/bronze && cp src/glass/assets/*.png dist/assets/glass/ && cp src/bronze/assets/*.png dist/assets/bronze/ && build/tweego/tweego src/glass -o dist/glass.html && node tools/patch-chapbook.js dist/glass.html && build/tweego/tweego src/bronze -o dist/bronze.html && node tools/patch-chapbook.js dist/bronze.html && python3 tools/build-landing.py && ls -la dist dist/assets/glass dist/assets/bronze
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4
